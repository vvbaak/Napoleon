<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Heads Up! Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="score-box">
          <span class="label">Score</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="timer-box">
          <span class="label">Tijd</span>
          <strong id="timerValue">90</strong>
        </div>
      </header>

      <main class="game-area">
        <section id="homeScreen" class="panel visible">
          <p class="eyebrow">Mobiele game</p>
          <h1>Heads Up!</h1>
          <p class="subtitle">Kies een categorie en houd de telefoon op je voorhoofd.</p>

          <div class="choice-group">
            <button class="mode-btn active" data-mode="kids" type="button">Kids</button>
            <button class="mode-btn" data-mode="adults" type="button">Volwassenen</button>
          </div>

          <button id="startButton" class="primary-btn" type="button">Start spel</button>
        </section>

        <section id="gameScreen" class="panel hidden">
          <div id="countdown" class="countdown" aria-live="polite">3</div>
          <div id="wordCard" class="word-card hidden">
            <span class="word-label">woord</span>
            <h2 id="wordText">?</h2>
          </div>
          <div id="statusText" class="status-text">Hou de telefoon op je voorhoofd</div>
          <button id="stopButton" class="secondary-btn" type="button">Stop spel</button>
        </section>

        <section id="endScreen" class="panel hidden">
          <p class="eyebrow">Einde ronde</p>
          <h2>Je score</h2>
          <div id="finalScore" class="final-score">0</div>
          <div class="end-actions">
            <button id="restartButton" class="primary-btn" type="button">Nog een keer</button>
            <button id="homeButton" class="secondary-btn" type="button">Hoofdscherm</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
